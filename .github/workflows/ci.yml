name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: bash ops/ci/fast.sh
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff
        with:
          tool: cargo-nextest@0.9.137,cargo-audit@0.22.1,cargo-deny@0.19.8,syft@1.40.0,zizmor@1.25.2
          fallback: none
      - run: bash ops/ci/github-setup.sh
      - run: bash ops/ci/combined.sh
      - name: Record and verify the real sample audit
        run: |
          node scripts/demo/generate-demo.mjs "$PWD/.fusion/target/debug/jankurai" "$PWD/target/audit-demo"
          node scripts/demo/verify-audit-gif.mjs "$PWD/target/audit-demo/rendered"
      - name: Verify the committed public demo catalog
        run: node scripts/demo/verify-audit-gif.mjs docs/demo
      - name: Independently cross-check decoded GIF pixels
        run: |
          python3 -m venv target/demo-venv
          target/demo-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r scripts/demo/requirements-demo.txt
          target/demo-venv/bin/python scripts/demo/verify-audit-gif.test.py
          target/demo-venv/bin/python scripts/demo/verify-audit-gif.py target/audit-demo/rendered --read-only
          target/demo-venv/bin/python scripts/demo/verify-audit-gif.py docs/demo --read-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-demo-gifs
          path: |
            target/audit-demo/rendered
            target/audit-demo/recording
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-evidence
          path: target/jankurai
          if-no-files-found: error
  release-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: bash ops/ci/github-setup.sh
      - run: bash ops/ci/release-build.sh
        env:
          TARGET: ${{ matrix.target }}
  required:
    name: jankurai/required
    if: always()
    needs: [fast, integration, release-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: bash ops/ci/install-gh.sh
      - run: bash ops/ci/aggregate.sh --hosted
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
  # CI tags are cut on the forge, which is the family authority. On a GitHub
  # mirror this job is inert instead of failing: the mirror is not the authority,
  # so JANKURAI_GITHUB_AUTHORITY is unset there.
  publish-ci-tag:
    needs: required
    if: vars.JANKURAI_GITHUB_AUTHORITY == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.required.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/publish-ci-tag.mjs
        env:
          GH_TOKEN: ${{ github.token }}
