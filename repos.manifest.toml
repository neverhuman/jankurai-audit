schema_version = "3.0.0"
family = "jankurai"
repo_family = "jankurai-split"
public_owner = "neverhuman"
local_owner = "root"
release = "1.7.2"
source_repo = "root/jankurai"
source_commit = "cea83b0cbe204be276a2f0299cd760f6812ea2b0"
split_root = "."
authority_manifest = "jankurai/repos.manifest.toml"
runtime_projection = "repos.manifest.toml"
# The hosted forge is the authority: git.neverhuman.org main of each root/<repo>
# is the source of truth and what gets deployed. GitHub is a mirror only, so
# `authority_forge = "github"` is rejected by scripts/validate-family.sh.
authority_forge = "jeryu"
hosted_base_url = "https://git.neverhuman.org"
hosted_git_url_template = "https://git.neverhuman.org/git/{owner}/{repo}.git"
# Mirror side. The old neverhumanbot/jankurai-* names cannot be transferred, so
# the org mirror carries the hub's `jankurai-audit` prefix.
mirror_forge = "github"
mirror_base_url = "https://github.com"
mirror_git_url_template = "https://github.com/{owner}/{repo}.git"
mirror_repo_prefix = "jankurai-audit"
# jankurai-action is published from root/jankurai-action but is not a family
# member: it carries no split-member metadata, no ops/ci/required.sh and no
# family.lock pin. It is mirrored only, and declared in [[mirror_only_repo]].
expected_repo_count = 15

required_repos = [
  "jankurai",
  "jankurai-core",
  "jankurai-contracts",
  "jankurai-standard",
  "jankurai-conformance",
  "jankurai-paper",
  "jankurai-tools-tui",
  "jankurai-tools-ux",
  "jankurai-tools-kernel",
  "jankurai-tools-guard",
  "jankurai-tools-proof",
  "jankurai-tools-dedup",
  "jankurai-tools-analyzers",
  "jankurai-tools-fleet",
  "jankurai-deploy",
]

[[repo]]
name = "jankurai"
path = "jankurai"
slug = "root/jankurai"
default_branch = "main"
required_check = "jankurai/required"
hosted = "https://git.neverhuman.org/git/root/jankurai.git"
jeryu_slug = "root/jankurai"
github = "https://github.com/neverhuman/jankurai-audit.git"
github_slug = "neverhuman/jankurai-audit"
mirror_github = true
mirror_github_main = true
role = "public-hub"
ci = "bash scripts/validate-family.sh"

[[repo]]
name = "jankurai-core"
path = "jankurai-core"
slug = "root/jankurai-core"
default_branch = "main"
required_check = "jankurai-core/required"
hosted = "https://git.neverhuman.org/git/root/jankurai-core.git"
jeryu_slug = "root/jankurai-core"
github = "https://github.com/neverhuman/jankurai-audit-core.git"
github_slug = "neverhuman/jankurai-audit-core"
mirror_github = true
mirror_github_main = true
role = "auditor-core"
ci = "cargo test --workspace --locked"

[[repo]]
name = "jankurai-contracts"
path = "jankurai-contracts"
slug = "root/jankurai-contracts"
default_branch = "main"
required_check = "jankurai-contracts/required"
hosted = "https://git.neverhuman.org/git/root/jankurai-contracts.git"
jeryu_slug = "root/jankurai-contracts"
github = "https://github.com/neverhuman/jankurai-audit-contracts.git"
github_slug = "neverhuman/jankurai-audit-contracts"
mirror_github = true
mirror_github_main = true
role = "artifact-contracts"
ci = "find schemas -name '*.json' -maxdepth 1 -print | sort | xargs -r -n1 jq empty"

[[repo]]
name = "jankurai-standard"
path = "jankurai-standard"
slug = "root/jankurai-standard"
default_branch = "main"
required_check = "jankurai-standard/required"
hosted = "https://git.neverhuman.org/git/root/jankurai-standard.git"
jeryu_slug = "root/jankurai-standard"
github = "https://github.com/neverhuman/jankurai-audit-standard.git"
github_slug = "neverhuman/jankurai-audit-standard"
mirror_github = true
mirror_github_main = true
role = "public-standard"
ci = "test -f docs/agent-native-standard.md && test -f docs/mission.md"

[[repo]]
name = "jankurai-conformance"
path = "jankurai-conformance"
slug = "root/jankurai-conformance"
default_branch = "main"
required_check = "jankurai-conformance/required"
hosted = "https://git.neverhuman.org/git/root/jankurai-conformance.git"
jeryu_slug = "root/jankurai-conformance"
github = "https://github.com/neverhuman/jankurai-audit-conformance.git"
github_slug = "neverhuman/jankurai-audit-conformance"
mirror_github = true
mirror_github_main = true
role = "conformance-corpus"
ci = "test -d conformance/fixtures && test -d conformance/expected"

[[repo]]
name = "jankurai-paper"
path = "jankurai-paper"
slug = "root/jankurai-paper"
default_branch = "main"
