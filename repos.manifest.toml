schema_version = "2.0.0"
family = "jankurai"
repo_family = "jankurai-split"
public_owner = "neverhuman"
local_owner = "root"
release = "1.7.1"
source_repo = "root/jankurai"
source_commit = "cea83b0cbe204be276a2f0299cd760f6812ea2b0"
split_root = "."
authority_manifest = "jankurai/repos.manifest.toml"
runtime_projection = "repos.manifest.toml"
authority_forge = "github"
expected_repo_count = 15
hosted_base_url = "https://github.com"
hosted_git_url_template = "https://github.com/{owner}/{repo}.git"

required_repos = [
  "jankurai",
  "jankurai-core",
  "jankurai-contracts",
  "jankurai-standard",
  "jankurai-conformance",
  "jankurai-paper",
  "jankurai-tools-tui",
  "jankurai-tools-ux",
  "jankurai-tools-kernel",
  "jankurai-tools-guard",
  "jankurai-tools-proof",
  "jankurai-tools-dedup",
  "jankurai-tools-analyzers",
  "jankurai-tools-fleet",
  "jankurai-deploy",
]

[[repo]]
name = "jankurai"
path = "jankurai"
slug = "neverhuman/jankurai"
default_branch = "main"
required_check = "jankurai/required"
hosted = "https://github.com/neverhuman/jankurai.git"
mirror_github = false
role = "public-hub"
github = "https://github.com/neverhuman/jankurai.git"
legacy_jeryu = "ssh://git@127.0.0.1:2224/root/jankurai.git"
ci = "bash scripts/validate-family.sh"

[[repo]]
name = "jankurai-core"
path = "jankurai-core"
slug = "neverhuman/jankurai-core"
default_branch = "main"
required_check = "jankurai-core/required"
hosted = "https://github.com/neverhuman/jankurai-core.git"
mirror_github = false
role = "auditor-core"
github = "https://github.com/neverhuman/jankurai-core.git"
legacy_jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-core.git"
ci = "cargo test --workspace --locked"

[[repo]]
name = "jankurai-contracts"
path = "jankurai-contracts"
slug = "neverhuman/jankurai-contracts"
default_branch = "main"
required_check = "jankurai-contracts/required"
hosted = "https://github.com/neverhuman/jankurai-contracts.git"
mirror_github = false
role = "artifact-contracts"
github = "https://github.com/neverhuman/jankurai-contracts.git"
legacy_jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-contracts.git"
ci = "find schemas -name '*.json' -maxdepth 1 -print | sort | xargs -r -n1 jq empty"

[[repo]]
name = "jankurai-standard"
path = "jankurai-standard"
slug = "neverhuman/jankurai-standard"
default_branch = "main"
required_check = "jankurai-standard/required"
hosted = "https://github.com/neverhuman/jankurai-standard.git"
mirror_github = false
role = "public-standard"
github = "https://github.com/neverhuman/jankurai-standard.git"
legacy_jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-standard.git"
ci = "test -f docs/agent-native-standard.md && test -f docs/mission.md"

[[repo]]
name = "jankurai-conformance"
path = "jankurai-conformance"
slug = "neverhuman/jankurai-conformance"
