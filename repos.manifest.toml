github = "https://github.com/neverhuman/jankurai-conformance.git"
legacy_jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-conformance.git"
ci = "test -d conformance/fixtures && test -d conformance/expected"

[[repo]]
name = "jankurai-paper"
path = "jankurai-paper"
slug = "neverhuman/jankurai-paper"
default_branch = "main"
required_check = "jankurai-paper/required"
hosted = "https://github.com/neverhuman/jankurai-paper.git"
