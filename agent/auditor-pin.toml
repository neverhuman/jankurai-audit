# The single family auditor pin.
#
# Every family member declares `auditor_version` in agent/standard-version.toml
# and every member that ships a GitHub Action declares a `release-tag` default
# in action.yml. Before this file existed those values drifted apart, so scores
# and baselines across the family could come from different engines.
# scripts/validate-family.mjs now fails when a member disagrees with the pin
# below, naming every repository that does.
#
# Publishing a release does not promote the governed scorer or move member
# Action defaults. v1.7.6 is published. The measured Linux binary SHA-256 is
# 63b445f21ca375ebd9515df49d0095aff6823b731121102651caf4e57cef1cf9.
# The binary field below remains pending until the locked Action defaults move
# together and the bounded previous-release allowance can be removed. Neither
# this sentinel nor the comments grant a governed installation authority.
schema_version = "1.0.0"
version = "1.7.6"
release_tag = "v1.7.6"
binary_sha256 = "pending"
# The locked member Action and immutable installer asset still default to
# v1.7.5. Keep this existing bounded allowance until the member default and hub
# lock are updated together, then remove both fields and record the measured
# binary hash above. Explicit --tag v1.7.6 selects the published release today.
# The validator still rejects other Action tags, a hash alongside this
# allowance, or use after the unchanged expiry. No checks are relaxed.
previous_published_release_tag = "v1.7.5"
previous_published_release_expires = "2026-11-14"
