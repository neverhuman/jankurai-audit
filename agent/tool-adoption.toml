schema_version = "1.0.0"

# Tool-adoption control plane for the jankurai public hub.
#
# The hub ships no Rust crate, product code, web surface, or database, so the
# Rust/cargo- and product-specific Jankurai tool lanes (proofbind, proofmark,
# copy-code, language bad-behavior, the jankurai-security dependency lane, etc.)
# have nothing to run here and are explicitly `disabled`. The tools that DO
# apply to a control-plane-only hub all adopt the single ratchet audit command
# that CI runs and records as repo-score evidence (see ops/ci/tool-adoption.sh). Secret scanning is still covered by the
# dedicated gitleaks security lane in `just security` / ops/ci/security.sh.

# --- Adopted: the ratchet audit lane proves all of these in CI ---
[[tools]]
id = "audit-ci"
mode = "auto"

[[tools]]
id = "proof-routing"
mode = "auto"

[[tools]]
id = "contract-drift"
mode = "auto"

[[tools]]
id = "authz-matrix"
mode = "auto"

[[tools]]
id = "agent-tool-supply"
mode = "auto"

[[tools]]
id = "release-readiness"
mode = "auto"

# --- Not applicable to a control-plane-only hub (no Rust/product surface) ---
[[tools]]
id = "proofbind"
mode = "disabled"

[[tools]]
id = "proofmark-rust"
mode = "disabled"

[[tools]]
id = "copy-code"
mode = "disabled"

[[tools]]
id = "security"
mode = "disabled"

[[tools]]
id = "ci-bad-behavior"
mode = "disabled"

[[tools]]
id = "git-bad-behavior"
mode = "disabled"

[[tools]]
id = "release-bad-behavior"
mode = "disabled"

[[tools]]
id = "ux-qa"
mode = "disabled"

[[tools]]
id = "db-migration-analyze"
mode = "disabled"

[[tools]]
id = "rust-witness"
mode = "disabled"

[[tools]]
id = "vibe-coverage"
mode = "disabled"

[[tools]]
id = "coverage-evidence"
mode = "disabled"

[[tools]]
id = "input-boundary"
mode = "disabled"

[[tools]]
id = "cost-budget"
mode = "disabled"
